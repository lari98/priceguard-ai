name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Node version pinned to the exact patch this project was developed and tested against
# (matches apps/api/Dockerfile, apps/web/Dockerfile and package.json "engines" fields),
# so CI can't silently drift to a different Node minor/patch than what's actually shipped.
env:
  NODE_VERSION: '22.22.2'

jobs:
  api:
    name: API (lint, typecheck, unit + e2e tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: geoguard
          POSTGRES_PASSWORD: geoguard_dev_password
          POSTGRES_DB: geoguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoguard -d geoguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://geoguard:geoguard_dev_password@localhost:5432/geoguard_test
      JWT_SECRET: ci-only-secret-not-for-production-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      VALKEY_URL: redis://localhost:6379
      BCRYPT_SALT_ROUNDS: '4' # low cost factor for CI speed only — never used outside tests
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations (test database)
        run: npm run db:migrate

      - name: e2e tests
        run: npm run test:e2e

      - name: Dependency audit (production dependencies only)
        # Fails the build on high/critical findings; moderate/low are tracked via
        # Dependabot (.github/dependabot.yml) rather than blocking every PR on them.
        # See docs/adr/0005-drizzle-not-prisma.md's follow-up note for the last real
        # high-severity finding this caught (a stray optional Prisma peer dependency).
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  web:
    name: Web dashboard (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: geoguard-api:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          tags: geoguard-web:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
